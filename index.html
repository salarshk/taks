  <style>

      '05':['five','🧠','🤝','🛡️','Begin with one trusted economic mind.','Bring good people and ideas into the circle.','A connected team helps protect the future.']
    }; const [kind,actor,object,result,first,second,third]=scenes[number]; return `<div class="story ${kind}"><span class="label beat-one">${first}</span><span class="label beat-two">${second}</span><span class="label beat-three">${third}</span><span class="trail"></span><span class="actor">${actor}</span><span class="object">${object}</span><span class="result">${result}</span></div>`; }
    function openDetail(task){ openTask=task; detailTitle.textContent=task.querySelector('h2').textContent; detailDescription.textContent=task.querySelector('p').textContent; const original=task.querySelector('.arrival,.home-swap,.asset-flow,.income-scene,.network-scene'); modalVisual.innerHTML=`<div class="legacy-visual">${original ? original.outerHTML : ''}</div><div class="story-visual">${story(task.querySelector('.number').textContent)}</div>`; detail.classList.add('open'); detail.setAttribute('aria-hidden','false'); completeButton.textContent=task.classList.contains('done') ? 'Mark mission incomplete' : 'Mark mission complete'; }
    tasks.forEach(task=>task.addEventListener('click',()=>openDetail(task)));
    completeButton.addEventListener('click',()=>{ if(!openTask) return; openTask.classList.toggle('done'); openTask.setAttribute('aria-pressed',openTask.classList.contains('done')); update(); completeButton.textContent=openTask.classList.contains('done') ? 'Mark mission incomplete' : 'Mark mission complete'; });
    document.querySelector('.detail-close').addEventListener('click',closeDetail); detail.addEventListener('click',event=>{ if(event.target===detail) closeDetail(); }); document.addEventListener('keydown',event=>{ if(event.key==='Escape') closeDetail(); });
    document.querySelector('.reset').addEventListener('click',()=>{tasks.forEach(t=>{t.classList.remove('done');t.setAttribute('aria-pressed','false');});update();}); update();
  </script>
</body>
